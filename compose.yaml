name: ${COMPOSE_PROJECT_NAME:-wowzerbowser}

# Relative cgroup v2 I/O weights. The host timer reapplies this policy to the
# separately deployed media and HomeTube containers as well.
x-io-interactive: &io-interactive
  weight: 1000

x-io-user-work: &io-user-work
  weight: 650

x-io-background: &io-background
  weight: 250

x-io-bulk: &io-bulk
  weight: 100

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wowzerbowser}
      POSTGRES_USER: ${POSTGRES_USER:-wowzerbowser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - application
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    blkio_config: *io-interactive
    cpus: "1.00"
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  opendataloader-hybrid:
    build:
      context: .
      dockerfile: docker/opendataloader/Dockerfile
    environment:
      HOME: /home/opendataloader
      XDG_CACHE_HOME: /var/cache/opendataloader
      HF_HOME: /var/cache/opendataloader/huggingface
      TORCH_HOME: /var/cache/opendataloader/torch
      CUDA_VISIBLE_DEVICES: ""
    expose:
      - "5002"
    networks:
      - application
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    blkio_config: *io-background
    cpus: "2.00"
    mem_limit: 3g
    pids_limit: 256
    volumes:
      - opendataloader-model-cache:/var/cache/opendataloader
    healthcheck:
      test: ["CMD", "python", "-c", "import cv2, easyocr, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  python-worker:
    build:
      context: .
      dockerfile: docker/python-worker/Dockerfile
    environment:
      PYTHON_WORKER_PORT: 5003
      PYTHON_WORKER_SECRET: ${PYTHON_WORKER_SECRET:?PYTHON_WORKER_SECRET must be set in the deployment environment}
      PYTHON_WORKSPACE_ROOT: /workspaces
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    expose:
      - "5003"
    volumes:
      - python-workspaces:/workspaces
    networks:
      - python-execution
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    blkio_config: *io-background
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run:size=16m
    cpus: "0.75"
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:5003/health', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  searxng:
    image: docker.io/searxng/searxng@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-replace-with-a-long-random-secret}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: 8080
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
      FORCE_OWNERSHIP: "false"
    group_add:
      - "${APP_GID:-1000}"
    volumes:
      - type: bind
        source: "/srv/storage/wowzerbowser/config/searxng/settings.yml"
        target: /etc/searxng/settings.yml
        read_only: true
        bind:
          create_host_path: false
      - searxng-cache:/var/cache/searxng
    expose:
      - "8080"
    networks:
      - application
    restart: unless-stopped
    init: true
    blkio_config: *io-background
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 30s

  miniflux-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miniflux
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${MINIFLUX_DB_PASSWORD:-replace-with-a-long-random-password}
    volumes:
      - miniflux-postgres-data:/var/lib/postgresql/data
    networks:
      - application
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    blkio_config: *io-background
    cpus: "0.50"
    mem_limit: 768m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  miniflux:
    image: miniflux/miniflux:latest
    environment:
      DATABASE_URL: postgres://miniflux:${MINIFLUX_DB_PASSWORD:-replace-with-a-long-random-password}@miniflux-postgres:5432/miniflux?sslmode=disable
      RUN_MIGRATIONS: 1
      CREATE_ADMIN: 1
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:-replace-with-a-long-random-password}
      BASE_URL: ${MINIFLUX_BASE_URL:-http://miniflux:8080}
    expose:
      - "8080"
    networks:
      - application
    depends_on:
      miniflux-postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    blkio_config: *io-background
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/" ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  firecrawl-redis:
    image: redis:7-alpine
    networks:
      - application
    restart: unless-stopped
    init: true
    blkio_config: *io-bulk
    cpus: "0.25"
    mem_limit: 256m
    pids_limit: 128

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    networks:
      - application
    restart: unless-stopped
    init: true
    blkio_config: *io-bulk
    cpus: "0.25"
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 20s
      retries: 6
      start_period: 120s

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    environment:
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: ${FIRECRAWL_DB_PASSWORD:-replace-with-a-long-random-password}
      POSTGRES_DB: firecrawl
    volumes:
      - firecrawl-postgres-data:/var/lib/postgresql/data
    networks:
      - application
    command: ["postgres", "-c", "cron.database_name=firecrawl"]
    restart: unless-stopped
    init: true
    blkio_config: *io-background
    cpus: "0.50"
    mem_limit: 768m
    pids_limit: 256

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: ${FIRECRAWL_MAX_CONCURRENT_PAGES:-1}
    expose:
      - "3000"
    networks:
      - application
    restart: unless-stopped
    init: true
    blkio_config: *io-bulk
    cpus: "0.75"
    mem_limit: 1g
    pids_limit: 256
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl@sha256:01d06cb04c429e19c0746ffbbd2ec5f1c67321e877cf3b02faec29108ac6a342
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      INTERNAL_PORT: 3002
      EXTRACT_WORKER_PORT: 3004
      WORKER_PORT: 3005
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: ${FIRECRAWL_DB_PASSWORD:-replace-with-a-long-random-password}
      POSTGRES_DB: firecrawl
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      BULL_AUTH_KEY: ${FIRECRAWL_BULL_AUTH_KEY:-replace-with-a-long-random-secret}
      SEARXNG_ENDPOINT: http://searxng:8080
      NUM_WORKERS_PER_QUEUE: ${FIRECRAWL_NUM_WORKERS_PER_QUEUE:-1}
      CRAWL_CONCURRENT_REQUESTS: ${FIRECRAWL_CRAWL_CONCURRENT_REQUESTS:-1}
      MAX_CONCURRENT_JOBS: ${FIRECRAWL_MAX_CONCURRENT_JOBS:-1}
      BROWSER_POOL_SIZE: ${FIRECRAWL_BROWSER_POOL_SIZE:-1}
    expose:
      - "3002"
    networks:
      - application
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
    volumes:
      - firecrawl-fdb-cluster-file:/var/fdb
    command: ["node", "dist/src/harness.js", "--start-docker"]
    restart: unless-stopped
    init: true
    blkio_config: *io-background
    cpus: "1.00"
    mem_limit: 3g
    pids_limit: 512

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - path: ${DEPLOYMENT_ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://homelab.tail861ffd.ts.net}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-wowzerbowser}
      POSTGRES_USER: ${POSTGRES_USER:-wowzerbowser}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      APP_OWNER_ID: ${APP_OWNER_ID:?APP_OWNER_ID must be set in the deployment environment}
      APP_STORAGE_ROOT: /srv/storage/wowzerbowser
      STORAGE_MOUNT_GUARD: ${STORAGE_MOUNT_GUARD:-unverified}
      WORKER_CHAT_CONCURRENCY: ${WORKER_CHAT_CONCURRENCY:-1}
      WORKER_DOCUMENT_CONCURRENCY: ${WORKER_DOCUMENT_CONCURRENCY:-1}
      WORKER_OCR_CONCURRENCY: ${WORKER_OCR_CONCURRENCY:-2}
      PDF_OCR_CONCURRENCY: ${PDF_OCR_CONCURRENCY:-2}
      PYTHON_WORKER_URL: ${PYTHON_WORKER_URL:-http://python-worker:5003}
      PYTHON_WORKER_SECRET: ${PYTHON_WORKER_SECRET:?PYTHON_WORKER_SECRET must be set in the deployment environment}
      OPENDATALOADER_HYBRID_URL: ${OPENDATALOADER_HYBRID_URL:-http://opendataloader-hybrid:5002}
      SEARCH_STACK_ENABLED: ${SEARCH_STACK_ENABLED:-true}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      MINIFLUX_URL: ${MINIFLUX_URL:-http://miniflux:8080}
      MINIFLUX_API_TOKEN: ${MINIFLUX_API_TOKEN:-}
      SEARCH_PROVIDER_CACHE_TTL_MS: ${SEARCH_PROVIDER_CACHE_TTL_MS:-15000}
      SEARCH_PROVIDER_FAILURE_THRESHOLD: ${SEARCH_PROVIDER_FAILURE_THRESHOLD:-3}
      SEARCH_PROVIDER_CIRCUIT_OPEN_MS: ${SEARCH_PROVIDER_CIRCUIT_OPEN_MS:-30000}
      FIRECRAWL_URL: ${FIRECRAWL_URL:-http://firecrawl:3002}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      HOMELAB_SSH_HOST: ${HOMELAB_SSH_HOST:-}
      HOMELAB_SSH_USER: ${HOMELAB_SSH_USER:-evanh}
      HOMELAB_SSH_KEY_FILE: ${HOMELAB_SSH_KEY_FILE:-}
      HOMELAB_WORKDIR: ${HOMELAB_WORKDIR:-/srv/storage/wowzerbowser}
      HOMELAB_OPENCODE_TURN_TIMEOUT_MS: ${HOMELAB_OPENCODE_TURN_TIMEOUT_MS:-600000}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - type: bind
        source: /srv/storage/wowzerbowser
        target: /srv/storage/wowzerbowser
        read_only: false
        bind:
          create_host_path: false
    networks:
      - application
      - python-execution
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      python-worker:
        condition: service_healthy
      opendataloader-hybrid:
        condition: service_healthy
      searxng:
        condition: service_started
      miniflux:
        condition: service_started
      firecrawl:
        condition: service_started
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    blkio_config: *io-interactive
    cpus: "1.50"
    mem_limit: 3g
    pids_limit: 512
    shm_size: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  background-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - path: ${DEPLOYMENT_ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-wowzerbowser}
      POSTGRES_USER: ${POSTGRES_USER:-wowzerbowser}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      APP_OWNER_ID: ${APP_OWNER_ID:?APP_OWNER_ID must be set in the deployment environment}
      APP_STORAGE_ROOT: /srv/storage/wowzerbowser
      STORAGE_MOUNT_GUARD: ${STORAGE_MOUNT_GUARD:-unverified}
      WORKER_CHAT_CONCURRENCY: ${WORKER_CHAT_CONCURRENCY:-1}
      WORKER_DOCUMENT_CONCURRENCY: ${WORKER_DOCUMENT_CONCURRENCY:-1}
      WORKER_IMAGE_CONCURRENCY: ${WORKER_IMAGE_CONCURRENCY:-1}
      WORKER_OCR_CONCURRENCY: ${WORKER_OCR_CONCURRENCY:-2}
      PDF_OCR_CONCURRENCY: ${PDF_OCR_CONCURRENCY:-2}
      PYTHON_WORKER_URL: ${PYTHON_WORKER_URL:-http://python-worker:5003}
      PYTHON_WORKER_SECRET: ${PYTHON_WORKER_SECRET:?PYTHON_WORKER_SECRET must be set in the deployment environment}
      OPENDATALOADER_HYBRID_URL: ${OPENDATALOADER_HYBRID_URL:-http://opendataloader-hybrid:5002}
      SEARCH_STACK_ENABLED: ${SEARCH_STACK_ENABLED:-true}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      MINIFLUX_URL: ${MINIFLUX_URL:-http://miniflux:8080}
      MINIFLUX_API_TOKEN: ${MINIFLUX_API_TOKEN:-}
      SEARCH_PROVIDER_CACHE_TTL_MS: ${SEARCH_PROVIDER_CACHE_TTL_MS:-15000}
      SEARCH_PROVIDER_FAILURE_THRESHOLD: ${SEARCH_PROVIDER_FAILURE_THRESHOLD:-3}
      SEARCH_PROVIDER_CIRCUIT_OPEN_MS: ${SEARCH_PROVIDER_CIRCUIT_OPEN_MS:-30000}
      FIRECRAWL_URL: ${FIRECRAWL_URL:-http://firecrawl:3002}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      HOMELAB_SSH_HOST: ${HOMELAB_SSH_HOST:-}
      HOMELAB_SSH_USER: ${HOMELAB_SSH_USER:-evanh}
      HOMELAB_SSH_KEY_FILE: ${HOMELAB_SSH_KEY_FILE:-}
      HOMELAB_WORKDIR: ${HOMELAB_WORKDIR:-/srv/storage/wowzerbowser}
      HOMELAB_OPENCODE_TURN_TIMEOUT_MS: ${HOMELAB_OPENCODE_TURN_TIMEOUT_MS:-600000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-5000}
      WORKER_HEARTBEAT_MAX_AGE_MS: ${WORKER_HEARTBEAT_MAX_AGE_MS:-30000}
      STORAGE_MAINTENANCE_INTERVAL_MS: ${STORAGE_MAINTENANCE_INTERVAL_MS:-60000}
      AUTOMATION_SCHEDULER_INTERVAL_MS: ${AUTOMATION_SCHEDULER_INTERVAL_MS:-30000}
      AUTOMATION_SCHEDULER_BATCH: ${AUTOMATION_SCHEDULER_BATCH:-1}
      MEMORY_SCHEDULER_INTERVAL_MS: ${MEMORY_SCHEDULER_INTERVAL_MS:-60000}
      DISCORD_PROCESSING_INTERVAL_MS: ${DISCORD_PROCESSING_INTERVAL_MS:-1000}
      WORKER_MAINTENANCE_LIMIT: ${WORKER_MAINTENANCE_LIMIT:-50}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["node", "scripts/background-worker.mjs"]
    volumes:
      - type: bind
        source: /srv/storage/wowzerbowser
        target: /srv/storage/wowzerbowser
        read_only: false
        bind:
          create_host_path: false
    networks:
      - application
      - python-execution
    depends_on:
      postgres:
        condition: service_healthy
      python-worker:
        condition: service_healthy
      opendataloader-hybrid:
        condition: service_healthy
      searxng:
        condition: service_started
      miniflux:
        condition: service_started
      firecrawl:
        condition: service_started
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    blkio_config: *io-user-work
    cpus: "1.50"
    mem_limit: 4g
    pids_limit: 512
    shm_size: 512m
    healthcheck:
      test: ["CMD", "node", "scripts/background-worker.mjs", "--health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  discord:
    profiles: ["discord"]
    build:
      context: .
      dockerfile: Dockerfile
      target: discord-runner
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://homelab.tail861ffd.ts.net}
      DISCORD_APP_URL: http://web:3000
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_USER_ID: ${DISCORD_ALLOWED_USER_ID:-}
      DISCORD_INTERNAL_SECRET: ${DISCORD_INTERNAL_SECRET:-}
      DISCORD_HEARTBEAT_FILE: /tmp/wowzerbowser-discord-worker.heartbeat
      DISCORD_HEARTBEAT_MAX_AGE_MS: ${DISCORD_HEARTBEAT_MAX_AGE_MS:-90000}
    entrypoint: ["node"]
    command: ["worker/discord-worker.mjs"]
    networks:
      - application
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    blkio_config: *io-user-work
    cpus: "0.50"
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "worker/discord-worker.mjs", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:
    name: wowzerbowser-postgres
  python-workspaces:
    name: ${PYTHON_WORKSPACE_VOLUME_NAME:-wowzerbowser-python-workspaces}
  opendataloader-model-cache:
    name: ${OPENDATALOADER_CACHE_VOLUME_NAME:-wowzerbowser-opendataloader-cache}
  searxng-cache:
    name: wowzerbowser-searxng-cache
  miniflux-postgres-data:
    name: wowzerbowser-miniflux-postgres
  firecrawl-postgres-data:
    name: wowzerbowser-firecrawl-postgres
  firecrawl-fdb-cluster-file:
    name: wowzerbowser-firecrawl-fdb-cluster

networks:
  application:
    name: wowzerbowser-application
  python-execution:
    name: ${PYTHON_EXECUTION_NETWORK_NAME:-wowzerbowser-python-execution}
