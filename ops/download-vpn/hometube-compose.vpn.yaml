services:
  postgres:
    networks:
      default:
        ipv4_address: 172.22.0.2
        aliases:
          - hometube-postgres

  worker:
    network_mode: "container:download-vpn"
    networks: !reset []
    environment:
      DATABASE_URL: postgresql://${HOMETUBE_POSTGRES_USER:-hometube}:${HOMETUBE_POSTGRES_PASSWORD:?Set HOMETUBE_POSTGRES_PASSWORD in the deployment environment}@172.22.0.2:5432/${HOMETUBE_POSTGRES_DB:-hometube}
      OPENDATALOADER_URL: http://opendataloader-hybrid:5002
