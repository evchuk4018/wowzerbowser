name: wowzerbowser-download-vpn

services:
  download-vpn:
    image: qmcgaw/gluetun:v3.40.4
    container_name: download-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    dns:
      - 127.0.0.1
    volumes:
      - type: bind
        source: ${WINDSCRIBE_RESOLVED_CONF_PATH:-/srv/storage/wowzerbowser/secrets/windscribe-philadelphia.resolved.conf}
        target: /gluetun/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOAD_VPN_IPTABLES_RULES_PATH:-/srv/storage/wowzerbowser/ops/download-vpn/iptables-post-rules.txt}
        target: /iptables/post-rules.txt
        read_only: true
        bind:
          create_host_path: false
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      # 1280 tunnel MTU; 25s keepalive holds external NAT states
      WIREGUARD_MTU: "1280"
      WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: "25s"
      TZ: ${TZ:-America/New_York}
      FIREWALL: on
      # These are the existing media UI ports. Binding remains limited to the
      # LAN and Tailscale addresses used by the current media stack.
      FIREWALL_INPUT_PORTS: "8080,5055,7878,8989,9696,8191,4000"
      FIREWALL_OUTBOUND_SUBNETS: "172.18.0.0/16,172.21.0.0/16,172.22.0.0/16,172.23.0.0/16,172.24.0.0/28,192.168.0.0/24,100.64.0.0/10"
      DNS_UPSTREAM_RESOLVER_TYPE: dot
      DNS_UPSTREAM_RESOLVERS: cloudflare,google
      DNS_UPSTREAM_IPV6: off
      BLOCK_MALICIOUS: on
      HEALTH_TARGET_ADDRESSES: cloudflare.com:443
    ports:
      - "${MEDIA_TAILSCALE_IP:-100.98.43.68}:${MEDIA_QBIT_HOST_PORT:-8080}:8080"
      - "${MEDIA_LAN_IP:-192.168.0.148}:${MEDIA_JELLYSEERR_HOST_PORT:-5055}:5055"
      - "${MEDIA_TAILSCALE_IP:-100.98.43.68}:${MEDIA_JELLYSEERR_HOST_PORT:-5055}:5055"
      - "${MEDIA_LAN_IP:-192.168.0.148}:${MEDIA_RADARR_HOST_PORT:-7878}:7878"
      - "${MEDIA_TAILSCALE_IP:-100.98.43.68}:${MEDIA_RADARR_HOST_PORT:-7878}:7878"
      - "${MEDIA_LAN_IP:-192.168.0.148}:${MEDIA_SONARR_HOST_PORT:-8989}:8989"
      - "${MEDIA_TAILSCALE_IP:-100.98.43.68}:${MEDIA_SONARR_HOST_PORT:-8989}:8989"
      - "${MEDIA_LAN_IP:-192.168.0.148}:${MEDIA_PROWLARR_HOST_PORT:-9696}:9696"
      - "${MEDIA_TAILSCALE_IP:-100.98.43.68}:${MEDIA_PROWLARR_HOST_PORT:-9696}:9696"
    networks:
      exit:
        priority: 1000
        gw_priority: 1000
        ipv4_address: 172.24.0.2
      media:
        aliases:
          - qbittorrent
          - prowlarr
          - radarr
          - sonarr
          - jellyseerr
          - flaresolverr
      hometube:
        ipv4_address: 172.22.0.3
        aliases:
          - worker
      application:
      music:
        aliases:
          - worker
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  exit:
    name: wowzerbowser-download-vpn-exit
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-wzvpnexit
    ipam:
      config:
        - subnet: 172.24.0.0/28
          gateway: 172.24.0.1
  media:
    name: media-stack
    external: true
  hometube:
    name: hometube_default
    external: true
  application:
    name: wowzerbowser-application
    external: true
  music:
    name: musicplayer_default
    external: true
